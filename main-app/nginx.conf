server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unlike S3 static website hosting, this serves index.html
    # with a real 200 status for any path (e.g. direct navigation/refresh on
    # /login works correctly here, unlike the known S3-hosting limitation).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed build assets (filename changes on every build) - safe to cache
    # forever, so a redeploy is never blocked by a stale browser cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
